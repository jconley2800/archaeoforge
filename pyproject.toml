[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archaeoforge"
version = "0.1.0"
description = "Evidence-controlled archaeological reconstruction automation for GIS, Blender, and multimodal AI workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ArchaeoForge contributors" }]
dependencies = [
  "typer>=0.16,<1",
  "rich>=14,<15",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "PyMuPDF>=1.26,<2",
  "Pillow>=11,<13",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "openai>=1.99,<4",
  "Jinja2>=3.1,<4",
  "shapely>=2.1,<3",
  "python-dotenv>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/jconley2800/archaeoforge"
Repository = "https://github.com/jconley2800/archaeoforge"
Issues = "https://github.com/jconley2800/archaeoforge/issues"

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[project.scripts]
archaeoforge = "archaeoforge.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archaeoforge = ["templates/*.j2", "blender/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
