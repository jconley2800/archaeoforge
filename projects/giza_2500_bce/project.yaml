schema_version: 1
project:
  id: giza-2500-bce
  title: Giza Plateau, approximately 2500 BCE | Evidence-led Late Fourth Dynasty Preview
  place_name: Giza Plateau
  target_year: -2500
  target_year_label: approximately 2500 BCE
  description: >-
    Evidence-controlled preview of a functioning late Fourth Dynasty landscape at
    approximately 2500 BCE. The visual pass prioritizes differentiated monument
    histories: intact but older Khufu and Khafre complexes, Menkaure's documented
    granite lower casing and incomplete finish, whitewashed-mudbrick completion,
    supported cemetery and settlement fabric, and a cautiously reconstructed
    waterfront. Exact chronology, local geometry, and shoreline remain needs-review.
  spatial_reference: LOCAL_METERS
  units: m
  origin_note: >-
    Survey-derived local-metre guide with the Khufu pyramid centre at
    [0.000, 300.000, 0.000]. +X east, +Y north, +Z up. Khafre is at
    [-333.978, -54.411, 10.100] and Menkaure at
    [-573.513, -440.152, 12.700], transformed from the cited Dash survey centres
    and elevations. The coordinate selection remains needs-review and is not
    georeferenced project control.
