<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#17324d"/>
    </marker>
    <pattern id="central-treads" width="100" height="22" patternUnits="userSpaceOnUse">
      <rect width="100" height="22" fill="#ead7aa"/>
      <path d="M0 1 H100" stroke="#745c35" stroke-width="3"/>
    </pattern>
    <pattern id="lateral-treads" width="22" height="100" patternUnits="userSpaceOnUse">
      <rect width="22" height="100" fill="#ead7aa"/>
      <path d="M1 0 V100" stroke="#745c35" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#f7f2e7"/>
  <text x="600" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#17324d">IMAGE 2 — ETEMENANKI SOUTH APPROACH ORIENTATION AID</text>
  <text x="600" y="78" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#5c5140">Top view • geometry reference only • show this capital-T arrangement in the photoreal scene</text>

  <path d="M110 180 V105" stroke="#17324d" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="110" y="205" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#17324d">NORTH</text>

  <rect x="150" y="125" width="900" height="380" rx="4" fill="#b98950" stroke="#17324d" stroke-width="8"/>
  <rect x="190" y="165" width="820" height="300" fill="#cda66d" stroke="#745c35" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="600" y="310" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700" fill="#3e301f">LOWEST ZIGGURAT STAGE</text>
  <text x="600" y="350" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#3e301f">No grand exterior stairs on the north, east, or west faces</text>

  <path d="M150 505 H1050" stroke="#17324d" stroke-width="12"/>
  <text x="600" y="492" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">SOUTH FACADE</text>

  <rect x="150" y="505" width="350" height="105" fill="url(#lateral-treads)" stroke="#17324d" stroke-width="7"/>
  <rect x="700" y="505" width="350" height="105" fill="url(#lateral-treads)" stroke="#17324d" stroke-width="7"/>
  <rect x="500" y="505" width="200" height="105" fill="#dec38e" stroke="#17324d" stroke-width="7"/>
  <text x="325" y="570" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#17324d">WEST LATERAL FLIGHT →</text>
  <text x="875" y="570" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#17324d">← EAST LATERAL FLIGHT</text>
  <text x="600" y="548" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#17324d">SHARED</text>
  <text x="600" y="575" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#17324d">LANDING</text>

  <rect x="520" y="610" width="160" height="220" fill="url(#central-treads)" stroke="#17324d" stroke-width="7"/>
  <path d="M600 805 V650" stroke="#17324d" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="600" y="862" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#17324d">CENTRAL FLIGHT — PERPENDICULAR TO FACADE</text>

  <path d="M150 660 H500 M700 660 H1050" stroke="#b33a32" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="325" y="700" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#b33a32">Lateral stairs stay on facade</text>
  <text x="875" y="700" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#b33a32">They do not fan south</text>
</svg>
